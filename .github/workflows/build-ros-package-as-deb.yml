name: Build ROS Debian package

on:
  workflow_call:
    inputs:
      package_name:
        description: Name of the ROS package to build
        required: true
        type: string
      ros_distribution:
        description: ROS 2 distribution to build against
        required: true
        type: string

jobs:
  build:
    name: Build ${{ inputs.package_name }} for ${{ inputs.ros_distribution }}
    runs-on: ${{ inputs.ros_distribution == 'humble' && 'ubuntu-22.04' || 'ubuntu-24.04' }}
    env:
      PACKAGE_NAME: ${{ inputs.package_name }}
      ROS_DISTRO: ${{ inputs.ros_distribution }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4   

      - name: Check package exists
        run: |
          if [[ ! -d "${PACKAGE_NAME}" || ! -f "${PACKAGE_NAME}/package.xml" ]]; then
            echo "ROS package '${PACKAGE_NAME}' was not found or has no package.xml" >&2
            exit 1
          fi

      - name: Set up ROS 2
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ env.ROS_DISTRO }}

      - name: Install packaging tools
        run: |
          sudo apt-get update && \
          sudo apt-get install --yes python3-bloom python3-rosdep fakeroot debhelper dh-python

      - name: Install package dependencies
        run: |
          mapfile -t local_package_names < <(colcon list --names-only)
          ubuntu_codename="$(. /etc/os-release && printf '%s' "${VERSION_CODENAME}")"
          local_rosdep_file="${RUNNER_TEMP}/sfg-local-rosdep.yaml"
          {
            for package_name in "${local_package_names[@]}"; do
              printf '%s:\n  ubuntu:\n    %s: [ros-%s-%s]\n' \
                "${package_name}" "${ubuntu_codename}" "${ROS_DISTRO}" "${package_name//_/-}"
            done
          } > "${local_rosdep_file}"
          printf 'yaml file://%s\n' "${local_rosdep_file}" | \
            sudo tee /etc/ros/rosdep/sources.list.d/99-sfg-local.list >/dev/null
          rosdep update
          mapfile -t dependency_paths < <(
            colcon list \
              --packages-up-to "${PACKAGE_NAME}" \
              --paths-only
          )
          rosdep install \
            --from-paths "${dependency_paths[@]}" \
            --ignore-src \
            --rosdistro "${ROS_DISTRO}" \
            --default-yes

      # temporary workaround for testing
      - name: Install package with pip
        if: github.ref_name == 'build_deb_packages'
        working-directory: ${{ env.PACKAGE_NAME }}
        run: python3 -m pip install pybind11[global] pybind11-stubgen

      - name: Build local package dependencies
        run: |
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          colcon build \
            --packages-up-to "${PACKAGE_NAME}" \
            --packages-skip "${PACKAGE_NAME}" \
            --merge-install

      - name: Generate Debian package
        working-directory: ${{ env.PACKAGE_NAME }}
        run: |
          if [[ -f "../install/setup.bash" ]]; then
            source ../install/setup.bash
          fi
          bloom-generate rosdebian

      - name: Build Debian package
        id: build_deb
        working-directory: ${{ env.PACKAGE_NAME }}
        run: |
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          if [[ -f "../install/setup.bash" ]]; then
            source ../install/setup.bash
          fi
          fakeroot debian/rules binary

          # Debian prohibits underscores in package names. Bloom automatically
          # converts ROS package underscores (_) to dashes (-) when building DEBs.
          # https://www.debian.org/doc/manuals/debian-reference/ch02.en.html#_debian_package_file_names
          DEB_PACKAGE_NAME="${{ inputs.package_name }}"
          DEB_PACKAGE_NAME="${DEB_PACKAGE_NAME//_/-}"
          echo "deb_package_name=${DEB_PACKAGE_NAME}" >> "${GITHUB_OUTPUT}"
                 
          mkdir -p "${GITHUB_WORKSPACE}/deb"
          cp ../ros-${ROS_DISTRO}-${DEB_PACKAGE_NAME}_*.deb "${GITHUB_WORKSPACE}/deb/"

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: ros-${{ env.ROS_DISTRO }}-${{ inputs.package_name }}
          path: deb/ros-${{ env.ROS_DISTRO }}-${{ steps.build_deb.outputs.deb_package_name }}_*.deb
          if-no-files-found: error